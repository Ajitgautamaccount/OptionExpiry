<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F&O Dashboard</title><style>*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1e2d45;
  --text:#e2e8f0;--muted:#64748b;--accent:#3b82f6;--accent2:#60a5fa;
  --gold:#f59e0b;--green:#10b981;--red:#ef4444;--teal:#14b8a6;
}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;min-height:100vh}
.hdr{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 60%,#0f172a 100%);
  border-bottom:1px solid var(--border);padding:12px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hdr-text .title{font-size:1.05rem;font-weight:700;
  background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-text .sub{font-size:.65rem;color:var(--muted);margin-top:1px}
.hdr-pills{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:20px;padding:3px 11px;font-size:.68rem;display:flex;align-items:center;gap:5px}
.pill .pv{font-weight:700;color:var(--accent2)}

/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.sw{position:relative;min-width:160px;max-width:220px;flex:1}
.sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted)}
#srch{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:6px 8px 6px 28px;border-radius:8px;font-size:.78rem;outline:none;transition:.2s}
#srch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}

/* EXPIRY FILTER BAR */
.ebar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:6px 20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;min-height:38px}
.elbl{font-size:.68rem;color:var(--muted);white-space:nowrap;margin-right:2px;font-weight:600}
.eBtn{border-radius:18px;padding:3px 11px;font-size:.68rem;font-weight:600;white-space:nowrap;
  border:1px solid var(--border);background:var(--surface2);color:var(--muted);
  cursor:pointer;transition:.15s;font-family:inherit}
.eBtn:hover{border-color:var(--accent2);color:var(--accent2)}
.eBtn.active{background:rgba(59,130,246,.18);border-color:var(--accent);color:var(--accent2)}
.eBtn.all{border-color:rgba(16,185,129,.3);color:var(--green)}
.eBtn.all.active{background:rgba(16,185,129,.12);border-color:var(--green);color:var(--green)}

/* WEEKLY BAR */
.wbar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:5px 20px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex-shrink:0;min-height:34px}
.wlbl{font-size:.65rem;color:var(--muted);white-space:nowrap;margin-right:2px}
.wc{border-radius:20px;padding:2px 9px;font-size:.63rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.wc.today{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#f87171}
.wc.near{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35);color:var(--gold)}
.wc.coming{background:rgba(59,130,246,.07);border-color:rgba(59,130,246,.2);color:#93c5fd}

/* MAIN LAYOUT */
.body-wrap{display:flex;flex:1;overflow:hidden;min-height:0}
.left{width:560px;min-width:340px;display:flex;flex-direction:column;
  border-right:1px solid var(--border);overflow:hidden;flex-shrink:0}
.right{flex:1;overflow-y:auto;min-width:0}

/* PANEL HEADERS */
.phdr{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:7px;background:var(--surface);flex-shrink:0}
.pico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:12px;flex-shrink:0}
.phdr h3{font-size:.76rem;font-weight:700;flex:1}
.gi .pico{background:rgba(245,158,11,.15)}.gi h3{color:var(--gold)}
.gm .pico{background:rgba(20,184,166,.15)}.gm h3{color:var(--teal)}
.ge .pico{background:rgba(59,130,246,.15)}.ge h3{color:var(--accent2)}
.pcnt{font-size:.62rem;color:var(--muted);background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;padding:1px 7px}

/* LEFT SCROLL AREAS */
.lscroll{overflow-y:auto;flex:1;overflow-x:hidden}
.divln{height:1px;background:var(--border);flex-shrink:0}

/* MINI TABLE (Index + MCX on left) */
table.mt{width:100%;border-collapse:collapse;font-size:.76rem}
table.mt thead th{background:var(--surface);padding:5px 10px;text-align:left;
  color:var(--muted);font-weight:600;font-size:.67rem;letter-spacing:.03em;
  position:sticky;top:0;z-index:4;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--border)}
table.mt thead th:hover{color:var(--text)}
table.mt tbody tr{border-bottom:1px solid rgba(30,45,69,.5)}
table.mt tbody tr:hover{background:var(--surface2)}
table.mt tbody tr.alt{background:rgba(10,14,26,.4)}
table.mt td{padding:5px 10px;white-space:nowrap}
.cs{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.75rem}
.ce{color:var(--muted);font-size:.7rem}
.cl{text-align:right;font-weight:600}
.cp{text-align:right;font-family:'JetBrains Mono',monospace;font-size:.74rem}
.cn{color:var(--muted);font-size:.7rem}

/* EQUITY TABLE */
.eq-sticky-hdr{position:sticky;top:0;z-index:10;background:var(--surface)}
table.et{width:100%;border-collapse:collapse;font-size:.8rem}
table.et thead th{background:var(--surface2);padding:7px 14px;text-align:left;
  color:var(--muted);font-weight:600;font-size:.7rem;letter-spacing:.03em;
  cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--border)}
table.et thead th:hover{color:var(--text)}
table.et tbody tr{border-bottom:1px solid rgba(30,45,69,.35)}
table.et tbody tr:hover{background:var(--surface2)}
table.et tbody tr.alt{background:rgba(17,24,39,.4)}
table.et td{padding:7px 14px;white-space:nowrap}
.es{font-family:'JetBrains Mono',monospace;font-weight:700}
.en{color:var(--muted);font-size:.74rem}
.ee{color:var(--muted);font-size:.74rem}
.el{text-align:right;color:var(--green);font-weight:700}
.ep{text-align:right;font-family:'JetBrains Mono',monospace}

.up{color:var(--green)!important}.dn{color:var(--red)!important}.na{color:var(--muted)!important}
.idx-c{color:var(--gold)!important}.mcx-c{color:var(--teal)!important}

/* BUTTONS */
.tbtn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  padding:5px 12px;border-radius:8px;font-size:.75rem;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
.tbtn:hover{border-color:var(--accent);color:var(--accent2)}
.tbtn.on{background:rgba(59,130,246,.15);border-color:var(--accent);color:var(--accent2);font-weight:600}
.tbtn.gr{color:var(--green);border-color:rgba(16,185,129,.3)}
.tbtn.gr:hover{background:rgba(16,185,129,.08)}
.ar-info{font-size:.68rem;color:var(--muted)}
.fb{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.78rem;
  padding:1px 3px;border-radius:3px;transition:.12s;vertical-align:middle}
.fb:hover{color:var(--accent2);background:rgba(59,130,246,.1)}

/* PAGINATION */
.pg{display:flex;gap:3px;align-items:center;padding:8px 14px;flex-wrap:wrap;
  border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;z-index:8}
.pb{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  padding:3px 8px;border-radius:4px;cursor:pointer;font-size:.7rem;font-family:inherit}
.pb:hover{border-color:var(--accent);color:var(--accent2)}
.pb.cur{background:rgba(59,130,246,.18);border-color:var(--accent);color:var(--accent2);font-weight:700}
.pgi{font-size:.68rem;color:var(--muted);margin-left:6px}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:.75rem}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* MOBILE */
@media(max-width:780px){
  .hdr-pills{display:none}
  .body-wrap{flex-direction:column;overflow:visible}
  .left{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);overflow:visible}
  .lscroll{overflow:visible}
  .right{overflow:visible}
  .lscroll,.right{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.mt,table.et{min-width:420px}
  .eq-sticky-hdr{position:static}
  .pg{position:static}
}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">

function fD(s){if(!s)return'';var p=s.split('-');return p[2]+'-'+MO[+p[1]]+'-'+p[0].slice(2);}
function fN(v){return v>0?v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';}

function init(){

function buildExpiryFilter(){
  var today=new Date();today.setHours(0,0,0,0);
  var h='<button class="eBtn all active" onclick="setExpiry(\'ALL\',this)">All Dates</button> ';
  EXPIRY_DATES.forEach(function(d){
    var dt=new Date(d),diff=Math.ceil((dt-today)/86400000);
    if(diff<0)return;
    h+='<button class="eBtn" onclick="setExpiry(\''+d+'\',this)">'+fD(d)+'</button> ';
  });
  document.getElementById('efilter-chips').innerHTML=h;
}

function setExpiry(d,btn){
  activeExpiry=d;
  document.querySelectorAll('.eBtn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  S.eq.pg=1;
  applyFilter();
}

function buildWkly(){
  var today=new Date();today.setHours(0,0,0,0);var h='';
  Object.keys(WKLY).sort().forEach(function(nm){
    WKLY[nm].forEach(function(d){
      var dt=new Date(d),diff=Math.ceil((dt-today)/86400000);
      if(diff<0)return;
      var cls=diff===0?'wc today':diff<=7?'wc near':'wc coming';
      h+='<span class="'+cls+'">'+nm+' '+fD(d)+'</span> ';
    });
  });
  document.getElementById('wchips').innerHTML=h||'<span style="color:var(--muted);font-size:.65rem">No upcoming weekly expiries</span>';
}

function applyFilter(){
  var q=document.getElementById('srch').value.toLowerCase().trim();
  ['idx','mcx','eq'].forEach(function(k){
    S[k].filt=S[k].data.filter(function(r){
      var matchQ=!q||(r.sym.toLowerCase().indexOf(q)>=0||r.name.toLowerCase().indexOf(q)>=0||r.und.toLowerCase().indexOf(q)>=0);
      var matchE=activeExpiry==='ALL'||r.expiry===activeExpiry;
      return matchQ&&matchE;
    });
    doSort(k);
  });
  if(S.eq.pg>Math.ceil(S.eq.filt.length/S.eq.PG))S.eq.pg=1;
  render();
}

function sortL(k,col){if(S[k].sort===col)S[k].dir*=-1;else{S[k].sort=col;S[k].dir=(col==='lot'?-1:1);}doSort(k);rL(k);}
function sortR(col){if(S.eq.sort===col)S.eq.dir*=-1;else{S.eq.sort=col;S.eq.dir=(col==='lot'?-1:1);}doSort('eq');S.eq.pg=1;rEq();}
function doSort(k){
  var c=S[k].sort,d=S[k].dir;
  S[k].filt.sort(function(a,b){
    var av=a[c]!=null?a[c]:'',bv=b[c]!=null?b[c]:'';
    if(c==='lot'||c==='lp')return(parseFloat(av)-parseFloat(bv))*d;
    return av<bv?-d:av>bv?d:0;
  });
}

  document.getElementById('eq-tb').innerHTML=h||'<tr><td colspan="5" class="empty">No results</td></tr>';
  document.getElementById('cnt-eq').textContent=total;
  document.getElementById('s-eq').textContent=total;
  bPg(total,pg,PG);
}

function bPg(total,pg,PG){
  var pages=Math.ceil(total/PG),el=document.getElementById('eq-pg');
  if(pages<=1){el.innerHTML='';return;}
  var h='',s=Math.max(1,pg-3),e=Math.min(pages,pg+3);
  if(pg>1)h+='<button class="pb" onclick="gP(1)">&laquo;</button><button class="pb" onclick="gP('+(pg-1)+')">&lsaquo;</button>';
  for(var p=s;p<=e;p++)h+='<button class="pb'+(p===pg?' cur':'')+'" onclick="gP('+p+')">'+p+'</button>';
  if(pg<pages)h+='<button class="pb" onclick="gP('+(pg+1)+')">&rsaquo;</button><button class="pb" onclick="gP('+pages+')">&raquo;</button>';
  h+='<span class="pgi">'+Math.min((pg-1)*PG+1,total)+'-'+Math.min(pg*PG,total)+' of '+total+'</span>';
  el.innerHTML=h;
}
function gP(p){S.eq.pg=p;rEq();}

function render(){rL('idx');rL('mcx');rEq();}

var proxies=[
  function(u){return'https://api.allorigins.win/raw?url='+encodeURIComponent(u);},
  function(u){return'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u);},
  function(u){return'https://corsproxy.io/?url='+encodeURIComponent(u);},
  function(u){return'https://thingproxy.freeboard.io/fetch/'+u;}
];
async function fetchNSE(url){
  for(var i=0;i<proxies.length;i++){
    try{
      var r=await fetch(proxies[i](url),{signal:AbortSignal.timeout(7000)});
      if(!r.ok)continue;
      var t=await r.text();
      if(!t||t.trim()[0]!=='{')continue;
      return JSON.parse(t);
    }catch(e){continue;}
  }
  return null;
}
async function fetchOne(und,btn){
  if(btn){btn.textContent='…';btn.disabled=true;}
  var val=null;
  var d=await fetchNSE('https://www.nseindia.com/api/quote-derivative?symbol='+encodeURIComponent(und));
  if(d&&d.underlyingValue)val=parseFloat(d.underlyingValue);
  if(!val||isNaN(val)){
    var e=await fetchNSE('https://www.nseindia.com/api/quote-equity?symbol='+encodeURIComponent(und));
    if(e&&e.priceInfo&&e.priceInfo.lastPrice)val=parseFloat(e.priceInfo.lastPrice);
  }
  if(val&&!isNaN(val))pCache[und]=val;
  if(btn){btn.textContent='↺';btn.disabled=false;}
  render();
}
async function refreshAll(){
  var seen={};
  S.idx.filt.concat(S.mcx.filt).concat(S.eq.filt).forEach(function(r){seen[r.und]=true;});
  var unds=Object.keys(seen);
  for(var i=0;i<unds.length;i++)await fetchOne(unds[i],null);
}
function toggleAR(){
  arOn=!arOn;
  var b=document.getElementById('arBtn');
  if(arOn){b.classList.add('on');arT=setInterval(refreshAll,30000);document.getElementById('arInfo').textContent='ON (30s)';}
  else{b.classList.remove('on');clearInterval(arT);document.getElementById('arInfo').textContent='';}
}
